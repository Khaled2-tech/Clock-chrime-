plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khaled.clockchime'
    compileSdk 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.khaled.clockchime'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
